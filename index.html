<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeless Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="okey.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">
                <span>🖤</span>
                <h1>LIFELESS</h1>
                <span>💛</span>
            </div>
            <p class="subtitle">CASINO</p>
        </div>

        <!-- Баланс -->
        <div id="balance-block">
            <div class="label">Баланс</div>
            <div class="balance">🪙 <span id="coins">0</span></div>
        </div>

        <!-- Меню кейсов -->
        <div class="section-title">🎰 Кейсы</div>
        <div class="cases-grid">
            <button class="case-btn" onclick="openCase('10')">
                <div class="case-icon">📦</div>
                <div class="case-info">
                    <span class="case-name">Новичка</span>
                    <span class="case-price">10 🪙</span>
                </div>
            </button>
            <button class="case-btn" onclick="openCase('50')">
                <div class="case-icon">💼</div>
                <div class="case-info">
                    <span class="case-name">Обычный</span>
                    <span class="case-price">50 🪙</span>
                </div>
            </button>
            <button class="case-btn" onclick="openCase('250')">
                <div class="case-icon">🔥</div>
                <div class="case-info">
                    <span class="case-name">Хайроллер</span>
                    <span class="case-price">250 🪙</span>
                </div>
            </button>
            <button class="case-btn" onclick="openCase('1000')">
                <div class="case-icon">💎</div>
                <div class="case-info">
                    <span class="case-name">Ультра</span>
                    <span class="case-price">1000 🪙</span>
                </div>
            </button>
        </div>

        <!-- Профиль -->
        <div class="section-title">👤 Профиль</div>
        <div id="profile-block">
            <div class="profile-row"><span>ID:</span> <span id="user-id">—</span></div>
            <div class="profile-row"><span>Кейсов открыто:</span> <span id="cases-opened">0</span></div>
            <div class="profile-row"><span>Реферальная ссылка:</span> <span id="ref-link">—</span></div>
        </div>

        <!-- Кнопка закрыть -->
        <button class="back-btn" onclick="closeApp()">🔙 Закрыть</button>
    </div>

    <!-- Модалка для анимации открытия -->
    <div id="open-modal" class="modal hidden">
        <div class="modal-content">
            <div class="spinner"></div>
            <div id="result-text">Открываем...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
